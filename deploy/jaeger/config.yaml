# Jaeger v2 (on top of the OpenTelemetry Collector): receives OTLP from the agent and keeps the
# traces in Badger for 7 days. UI and API on 16686: Grafana queries through jaeger:16686, and on
# the host it only opens in development, through jaeger-ui (deploy/stack.yml).
# The `jaeger` volume is mounted on /tmp: Docker copies the image's /tmp permissions to it,
# writable by the Jaeger user (10001); a new directory would be root-only.
# Version pinned at 2.20: 2.21 removed the v1 HTTP API (/api/services, /api/traces), which
# Grafana's Jaeger datasource (12.2 and 12.4) still uses.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    metrics:
      level: none
    traces:
      level: none   # no internal spans (e.g. Badger.Compaction) as a "jaeger" service
    logs:
      level: warn
      encoding: json

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: badger_store
    enable_tracing: false   # no traces of Jaeger itself ("jaeger" service) mixed with the agent's
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  jaeger_storage:
    backends:
      badger_store:
        badger:
          directories:
            keys: /tmp/jaeger/keys
            values: /tmp/jaeger/values
          ephemeral: false
          ttl:
            spans: 168h   # 7 days

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_store
