# Services of the local/VPS deployment. Start them through deploy/docker-compose.yml, which
# includes this file with the variables of the root .env:
#   docker compose -f deploy/docker-compose.yml up -d
# Ports published only on 127.0.0.1: on a VPS, reach Grafana through an SSH tunnel.

# Log rotation on the host (Alloy reads from here and sends to Loki, which keeps 30 days).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

# SigNoz (traces, logs and metrics alongside Jaeger and Loki): manifests generated by
# Foundry in deploy/signoz/pours, with the local adjustments of deploy/signoz/compose.override.yaml.
include:
  - path:
      - signoz/pours/deployment/compose.yaml
      - signoz/compose.override.yaml

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade_agent
      POSTGRES_USER: trade_agent
      POSTGRES_PASSWORD: ${TA_POSTGRES_PASSWORD:-trade_agent_dev}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_dev}
    ports:
      - "127.0.0.1:5432:5432"   # never expose publicly
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # Grafana's read-only user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_agent -d trade_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  agent:
    build:
      context: ..
    restart: unless-stopped
    # On stop (SIGTERM), the agent finishes the task in progress and records agent.stopped.
    # Docker's default 10 s do not cover a news collection (up to 15 s per source, in
    # parallel). A decision cycle (minutes, with the LLM) is still interrupted; the startup
    # reconciliation restores the state. In Kubernetes, the equivalent is terminationGracePeriodSeconds.
    stop_grace_period: 30s
    env_file:
      - path: ../.env
        required: false
    environment:
      TA_DATABASE_URL: postgresql+asyncpg://trade_agent:${TA_POSTGRES_PASSWORD:-trade_agent_dev}@postgres:5432/trade_agent
      TA_LOG_FORMAT: json
      # traces (OpenTelemetry) to Jaeger and SigNoz; agent metrics to SigNoz
      TA_OTLP_ENDPOINT: http://jaeger:4318,http://signoz-ingester:4318
      TA_OTLP_METRICS_ENDPOINT: http://signoz-ingester:4318
    volumes:
      - ../secrets:/app/secrets:ro
      - ../config:/app/config:ro   # profiles, circuit breakers and analyst: edit and restart the agent
    networks: [default, signoz-network]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    # renders the Telegram chatid as text in a copy of the provisioning and starts Grafana
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -rf /tmp/provisioning && cp -r /etc/grafana/provisioning-src /tmp/provisioning &&
        sed -i "s/__TELEGRAM_CHAT_ID__/$${TELEGRAM_CHAT_ID}/" /tmp/provisioning/alerting/telegram.yaml &&
        exec /run.sh
    environment:
      GF_PATHS_PROVISIONING: /tmp/provisioning
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_dev}
      # Grafana alerts in the agent's chat (the placeholder keeps the provisioning valid)
      TELEGRAM_BOT_TOKEN: ${TA_TELEGRAM_BOT_TOKEN:-nao-configurado}
      TELEGRAM_CHAT_ID: ${TA_TELEGRAM_CHAT_ID:-0}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Agent traces (OpenTelemetry → OTLP): one service per component, 7 days in Badger.
  # No ports on the host: Grafana (Explore → Traces) and the agent reach it on the internal network.
  # The UI on the host exists only in development: see jaeger-ui, right below.
  jaeger:
    image: jaegertracing/jaeger:2.20.0   # 2.21 removed the v1 API that Grafana uses
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger:/tmp   # Badger in /tmp/jaeger (permissions: see deploy/jaeger/config.yaml)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/status"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  # ── DEVELOPMENT ONLY (Rancher Desktop on Windows): OFF BY DEFAULT ───────────────────────────
  # Opens the Jaeger UI at http://127.0.0.1:16686 (with the System Architecture graph).
  # Why a relay, and not the port on Jaeger itself: Rancher Desktop does not delete the NAT
  # rule of a container that stops, and the port dies if it comes back with another IP
  # (runbook, §1.2). socat looks Jaeger up by name on every connection: recreating Jaeger does
  # not affect the port. It sits on a single network, because Rancher Desktop does not forward
  # the port of a container on several networks.
  # Turn on: DEV_JAEGER_UI=1 in the root .env and `docker compose -f deploy/docker-compose.yml up -d`.
  # Turn off: delete the line (or use 0) and run the same command. Off, no container is
  # created (zero replicas), but Compose still pulls the image (about 6 MB). Changing the
  # variable also restarts the agent, which receives the whole .env: do it outside a cycle.
  # On Linux or Kubernetes, leave it off: the traces are in Grafana (Explore → Traces).
  jaeger-ui:
    image: alpine/socat:1.8.1.3
    restart: unless-stopped
    command: ["tcp-listen:16686,fork,reuseaddr", "tcp-connect:jaeger:16686"]
    ports:
      - "127.0.0.1:16686:16686"
    deploy:
      replicas: ${DEV_JAEGER_UI:-0}   # 0 = off (default); 1 = on
    logging: *logging

  # Container logs: Alloy collects → Loki stores → Grafana queries ("Logs" dashboard).
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    logging: *logging

  # Read-only Docker API (list containers, read logs and stats), on an internal network only
  # the collectors (Alloy and container-metrics) reach: the socket is equivalent to root on
  # the host, and inspecting a container shows its environment variables (the .env keys).
  # POST, EXEC and the rest stay off.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"   # Alloy's container discovery also lists the networks
      LOG_LEVEL: warning   # no access log for each Alloy read (it would come back to Loki)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # the image's own plus a backend without the 10 min cut for docker logs --follow
      - ./docker-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks: [docker-api]
    logging: *logging

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"   # Alloy UI: discovered targets and pipeline health
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data   # read position of each container
    networks: [default, docker-api, signoz-network]   # logs to Loki and to SigNoz
    depends_on: [docker-proxy, loki]
    logging: *logging

  # CPU, memory, network and disk of each project container → SigNoz (docker_stats).
  container-metrics:
    image: otel/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/container-metrics.yaml:/etc/otelcol/config.yaml:ro
    networks: [docker-api, signoz-network]
    depends_on: [docker-proxy]
    logging: *logging

networks:
  docker-api:
    internal: true

volumes:
  pgdata: {}
  grafana: {}
  loki: {}
  alloy: {}
  jaeger: {}
