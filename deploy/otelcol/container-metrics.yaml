# CPU, memory, network and disk of each project container (docker_stats) → SigNoz.
# Reads the Docker API through the read-only proxy (docker-proxy), like Alloy. The startup
# warning about a "TCP connection to Docker without TLS" refers to that proxy, on an internal network.
receivers:
  docker_stats:
    endpoint: tcp://docker-proxy:2375
    collection_interval: 30s
    timeout: 10s
    container_labels_to_metric_labels:
      com.docker.compose.project: compose.project
      com.docker.compose.service: compose.service

processors:
  # only this project's containers (the VM also runs the local Kubernetes)
  filter/project:
    error_mode: ignore
    metrics:
      metric:
        - resource.attributes["compose.project"] != "trade-agent"
  resource:
    attributes:
      - key: service.namespace
        value: trade-agent
        action: upsert
  batch:
    timeout: 10s

exporters:
  otlp_http:
    endpoint: http://signoz-ingester:4318

service:
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors: [filter/project, resource, batch]
      exporters: [otlp_http]
  telemetry:
    logs:
      level: warn
      encoding: json
    metrics:
      level: none
