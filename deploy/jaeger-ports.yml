# Publica no host a interface do Jaeger (16686, com o grafo System Architecture) e o OTLP
# (4318, para o agente rodando fora do compose), só quando precisar:
#   docker compose -f deploy/docker-compose.yml -f deploy/jaeger-ports.yml up -d jaeger
# Para tirar de novo: docker compose -f deploy/docker-compose.yml up -d jaeger
# No dia a dia, os traces ficam no Grafana (Explore → Traces), pela rede interna. Cada porta
# publicada é mais uma regra de NAT que o Rancher Desktop pode deixar velha (runbook, §1.2).
services:
  jaeger:
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
