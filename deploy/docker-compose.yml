# Implantação local/VPS. Uso (a partir da raiz do repositório):
#   docker compose -f deploy/docker-compose.yml up -d
#
# Os serviços ficam em stack.yml. Este arquivo só o inclui com as variáveis do .env da raiz,
# que passa a ser obrigatório. Sem isso, o Compose procura o .env na pasta deste arquivo
# (deploy/), não o acha e usa os valores padrão: o Grafana subia com a senha padrão do
# usuário grafana_ro (o banco a recusava) e sem o token do Telegram.
name: trade-agent

include:
  - path: stack.yml
    env_file: ../.env
