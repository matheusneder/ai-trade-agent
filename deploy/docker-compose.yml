# Local/VPS deployment. Usage (from the repository root):
#   docker compose -f deploy/docker-compose.yml up -d
#
# The services live in stack.yml. This file only includes it with the variables of the root
# .env, which becomes mandatory. Without this, Compose looks for the .env in this file's
# folder (deploy/), does not find it and uses the default values: Grafana used to start with
# the grafana_ro user's default password (the database refused it) and without the Telegram token.
name: trade-agent

include:
  - path: stack.yml
    env_file: ../.env
