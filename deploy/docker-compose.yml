# Implantação local/VPS. Uso (a partir da raiz do repositório):
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
# Portas publicadas só em 127.0.0.1: acesse o Grafana por túnel SSH em uma VPS.
name: trade-agent

# Rotação dos logs no host (o Alloy lê daqui e envia ao Loki, que guarda 30 dias).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade_agent
      POSTGRES_USER: trade_agent
      POSTGRES_PASSWORD: ${TA_POSTGRES_PASSWORD:-trade_agent_dev}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_dev}
    ports:
      - "127.0.0.1:5432:5432"   # nunca expor publicamente
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # usuário somente leitura do Grafana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_agent -d trade_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  agent:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      TA_DATABASE_URL: postgresql+asyncpg://trade_agent:${TA_POSTGRES_PASSWORD:-trade_agent_dev}@postgres:5432/trade_agent
      TA_LOG_FORMAT: json
    volumes:
      - ../secrets:/app/secrets:ro
      - ../config:/app/config:ro   # perfis, disjuntores e analista: edite e reinicie o agente
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    # renderiza o chatid do Telegram como texto numa cópia do provisionamento e inicia o Grafana
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -rf /tmp/provisioning && cp -r /etc/grafana/provisioning-src /tmp/provisioning &&
        sed -i "s/__TELEGRAM_CHAT_ID__/$${TELEGRAM_CHAT_ID}/" /tmp/provisioning/alerting/telegram.yaml &&
        exec /run.sh
    environment:
      GF_PATHS_PROVISIONING: /tmp/provisioning
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_dev}
      # alertas do Grafana no mesmo chat do agente (placeholder mantém o provisionamento válido)
      TELEGRAM_BOT_TOKEN: ${TA_TELEGRAM_BOT_TOKEN:-nao-configurado}
      TELEGRAM_CHAT_ID: ${TA_TELEGRAM_CHAT_ID:-0}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Logs dos contêineres: Alloy coleta → Loki guarda → Grafana consulta (dashboard "Logs").
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    logging: *logging

  # API do Docker só para leitura (listar contêineres e ler logs), numa rede interna que só
  # o Alloy alcança: o socket equivale a root no host, e a inspeção de um contêiner mostra
  # as variáveis de ambiente (chaves do .env). POST, EXEC e o resto ficam desligados.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"   # a descoberta de contêineres do Alloy também lista as redes
      LOG_LEVEL: warning   # sem o log de acesso de cada leitura do Alloy (voltaria ao Loki)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    logging: *logging

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"   # interface do Alloy: alvos descobertos e saúde do pipeline
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data   # posição de leitura de cada contêiner
    networks: [default, docker-api]
    depends_on: [docker-proxy, loki]
    logging: *logging

networks:
  docker-api:
    internal: true

volumes:
  pgdata: {}
  grafana: {}
  loki: {}
  alloy: {}
