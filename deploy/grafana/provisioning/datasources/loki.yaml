# Container logs (Loki, fed by Alloy). Labels: service and level.
# An agent log with a trace_id gets the "Abrir trace" link to Jaeger. `$$` escapes the `$`
# of the provisioning's environment variable interpolation.
apiVersion: 1

datasources:
  - name: Logs
    uid: trade-agent-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id": "([0-9a-f]{32})"'
          datasourceUid: trade-agent-jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: Abrir trace
