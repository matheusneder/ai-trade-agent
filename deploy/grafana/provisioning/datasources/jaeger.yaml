# Agent traces (Jaeger). Each span opens the logs of the same trace in Loki ("Logs for this
# span"): the agent writes trace_id in every log. `$$` escapes the `$` of the provisioning's
# environment variable interpolation.
apiVersion: 1

datasources:
  - name: Traces
    uid: trade-agent-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: trade-agent-loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service="agent"} | trace_id="$${__trace.traceId}"'
