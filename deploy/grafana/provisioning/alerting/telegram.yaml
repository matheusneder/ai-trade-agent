# Alert contact point and policy: everything goes to the agent's Telegram chat.
# The chatid is replaced at container startup (see deploy/stack.yml): Grafana turns any
# numeric environment variable into a number, and Telegram requires a string.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: ta-telegram
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "__TELEGRAM_CHAT_ID__"
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: telegram
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
