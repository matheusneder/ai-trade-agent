# Contato e política de alertas: tudo vai para o mesmo chat do agente no Telegram.
# O chatid é substituído na partida do contêiner (ver deploy/docker-compose.yml): o Grafana
# converte em número qualquer variável de ambiente numérica, e o Telegram exige string.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: ta-telegram
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "__TELEGRAM_CHAT_ID__"
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: telegram
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
