# Ajustes locais sobre os manifestos gerados pelo Foundry (pours/deployment/compose.yaml),
# aplicados pelo `include` de deploy/stack.yml. Os manifestos saem publicando portas
# em todas as interfaces; aqui, só em 127.0.0.1, e o OTLP do SigNoz fica na 14318 no host (a
# 4318 é do Jaeger). Dentro da rede, o agente e o Alloy usam signoz-ingester:4318.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  ingester:
    ports: !override
      - "127.0.0.1:14318:4318"   # OTLP/HTTP para o agente rodando fora do compose (uv run)
    logging: *logging

  signoz-signoz-0:
    ports: !override
      - "127.0.0.1:8080:8080"   # interface do SigNoz
    logging: *logging

  signoz-metastore-postgres-0:
    logging: *logging

  signoz-telemetrykeeper-clickhousekeeper-0:
    logging: *logging

  signoz-telemetrystore-clickhouse-0-0:
    logging: *logging

  signoz-telemetrystore-clickhouse-user-scripts:
    logging: *logging

  signoz-telemetrystore-migrator:
    logging: *logging
