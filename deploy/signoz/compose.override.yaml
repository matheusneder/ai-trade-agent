# Local adjustments on top of the manifests generated by Foundry (pours/deployment/compose.yaml),
# applied by the `include` of deploy/stack.yml. The manifests publish ports on every
# interface; here, only on 127.0.0.1, and SigNoz's OTLP sits on 14318 on the host (leaving
# 4318, the default OTLP port, free). Inside the network, the agent and Alloy use
# signoz-ingester:4318.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  ingester:
    ports: !override
      - "127.0.0.1:14318:4318"   # OTLP/HTTP for the agent running outside compose (uv run)
    logging: *logging

  signoz-signoz-0:
    ports: !override
      - "127.0.0.1:8080:8080"   # SigNoz UI
    # without the metastore accepting connections, SigNoz exits at startup ("connection refused")
    # and only comes up on the next restart
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
    logging: *logging

  signoz-metastore-postgres-0:
    logging: *logging

  signoz-telemetrykeeper-clickhousekeeper-0:
    logging: *logging

  signoz-telemetrystore-clickhouse-0-0:
    logging: *logging

  signoz-telemetrystore-clickhouse-user-scripts:
    logging: *logging

  signoz-telemetrystore-migrator:
    logging: *logging
