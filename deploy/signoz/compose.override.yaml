# Local adjustments on top of the manifests generated by Foundry (pours/deployment/compose.yaml),
# applied by the `include` of deploy/stack.yml. The manifests publish ports on every
# interface; here, only on 127.0.0.1 (the UI can be opened to the local network in
# development, see below), and SigNoz's OTLP sits on 14318 on the host (leaving 4318, the
# default OTLP port, free). Inside the network, the agent and Alloy use signoz-ingester:4318.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  ingester:
    ports: !override
      - "127.0.0.1:14318:4318"   # OTLP/HTTP for the agent running outside compose (uv run)
    logging: *logging

  signoz-signoz-0:
    ports: !override
      # ── DEVELOPMENT ONLY: OFF BY DEFAULT ──────────────────────────────────────────────────
      # The UI listens on this machine only. To open it to the local network (e.g. a phone on
      # the same Wi-Fi), put DEV_SIGNOZ_UI_HOST=0.0.0.0 (or this machine's LAN IP) in the root
      # .env and run `docker compose -f deploy/docker-compose.yml up -d`. The access still asks
      # for the SigNoz login, but over plain HTTP. On a VPS, leave it unset.
      - "${DEV_SIGNOZ_UI_HOST:-127.0.0.1}:8080:8080"   # SigNoz UI
    # without the metastore accepting connections, SigNoz exits at startup ("connection refused")
    # and only comes up on the next restart
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
    logging: *logging

  signoz-metastore-postgres-0:
    logging: *logging

  signoz-telemetrykeeper-clickhousekeeper-0:
    logging: *logging

  signoz-telemetrystore-clickhouse-0-0:
    # ClickHouse registers itself in the keeper (/clickhouse/task_queue/replicas) under its
    # hostname. Docker's default is the container ID, a new one on every recreation; the old
    # entries stay, and each startup tries to resolve them ("Cannot resolve host", ~3 s apiece).
    # A fixed hostname, the same name the cluster config uses, keeps a single entry.
    hostname: signoz-telemetrystore-clickhouse-0-0
    logging: *logging

  signoz-telemetrystore-clickhouse-user-scripts:
    logging: *logging

  signoz-telemetrystore-migrator:
    logging: *logging
