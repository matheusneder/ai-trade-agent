# Ephemeral, isolated SigNoz for the dashboard smoke tests. Applied on top of the manifests
# generated by Foundry (deploy/signoz/pours/deployment/compose.yaml), so the images, versions
# and configuration files are always the ones in deploy/:
#
#   docker compose -p ta-signoz-smoke \
#     -f deploy/signoz/pours/deployment/compose.yaml \
#     -f tests/signoz-dashboard-smoke-tests/compose.override.yaml up -d
#
# The base manifests pin container, network and volume names (signoz-signoz-0,
# signoz-network, signoz-telemetrystore-0-0-data...) and publish ports on every interface:
# exactly the names and ports of the real stack. Everything is renamed here and the ports go
# to random host ports on 127.0.0.1. tests/support/signoz_smoke/environment.py refuses to start when the
# rendered configuration still mentions any of the production names. Relative paths resolve
# against the folder of the base manifest, as Compose does for every file.

services:
  ingester:
    ports: !override
      - "127.0.0.1::4318"   # OTLP/HTTP for the seed (random host port)

  signoz-metastore-postgres-0:
    container_name: ta-signoz-smoke-metastore-postgres-0
    healthcheck:
      interval: 2s
      start_period: 60s
    volumes: !override
      - metastore-data:/var/lib/postgresql/data

  signoz-signoz-0:
    container_name: ta-signoz-smoke-signoz-0
    ports: !override
      - "127.0.0.1::8080"   # SigNoz UI and API (random host port)
    # without the metastore accepting connections, SigNoz exits at startup
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
    healthcheck:
      interval: 3s
      start_period: 120s

  signoz-telemetrykeeper-clickhousekeeper-0:
    container_name: ta-signoz-smoke-telemetrykeeper-clickhousekeeper-0
    healthcheck:
      interval: 2s
      start_period: 60s
    volumes: !override
      - keeper-data:/var/lib/clickhouse-keeper
      - ./telemetrykeeper/clickhousekeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro

  signoz-telemetrystore-clickhouse-0-0:
    container_name: ta-signoz-smoke-telemetrystore-clickhouse-0-0
    # the cluster configuration refers to this name (see deploy/signoz/compose.override.yaml)
    hostname: signoz-telemetrystore-clickhouse-0-0
    healthcheck:
      interval: 2s
      start_period: 60s
    volumes: !override
      - clickhouse-data:/var/lib/clickhouse
      - user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro

  signoz-telemetrystore-clickhouse-user-scripts:
    container_name: ta-signoz-smoke-telemetrystore-clickhouse-user-scripts
    # Same download as the base, but it never blocks ClickHouse: with GitHub unreachable the
    # base retries forever. The dashboards do not call histogramQuantile (metric histograms).
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        cd /tmp
        if wget -q -T 20 -t 2 -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz" \
          && tar -xzf histogram-quantile.tar.gz; then
          mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        else
          echo "histogramQuantile unavailable (offline?): not used by the dashboards"
        fi
    restart: "no"
    volumes: !override
      - user-scripts:/var/lib/clickhouse/user_scripts

  signoz-telemetrystore-migrator:
    container_name: ta-signoz-smoke-telemetrystore-migrator

networks:
  signoz-network:
    name: ta-signoz-smoke-network

volumes:
  signoz-metastore-postgres-0-data: !reset null
  signoz-telemetrykeeper-0-data: !reset null
  signoz-telemetrystore-0-0-data: !reset null
  signoz-telemetrystore-user-scripts: !reset null
  metastore-data:
  keeper-data:
  clickhouse-data:
  user-scripts:
