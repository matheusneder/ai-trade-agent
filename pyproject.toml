[project]
name = "trade-agent"
version = "0.1.0"
description = "Agente autônomo de trade de criptomoedas na Binance Spot com proteção nativa (OPOCO/OCO)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.16",
    "anthropic>=1.8.0",
    "asyncpg>=0.30",
    "cryptography>=45",
    "feedparser>=6.0.14",
    "httpx>=0.28",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "structlog>=25",
    "ta-lib>=0.6",
    "websockets>=15",
]

[project.scripts]
trade-agent = "trade_agent.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "mypy>=1.17",
    "pandas-stubs>=2.2",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "respx>=0.22",
    "ruff>=0.12",
    "testcontainers[postgres]>=4.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_agent"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "ASYNC", "S", "DTZ", "TID", "PL",
]
ignore = [
    "PLR0913",  # muitos argumentos: builders de ordem espelham a API da Binance
    "PLR2004",  # constantes mágicas em comparações
    "RUF001", "RUF002", "RUF003",  # caracteres ambíguos (textos em pt-BR)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415", "PLR0917", "SLF001", "PT018", "C408"]
"scripts/**" = ["T201", "S101"]
"src/trade_agent/persistence/migrations/**" = ["E501"]
"lab/freqtrade/**" = ["E501", "ARG002", "PLR0917"]

[tool.ruff.lint.pylint]
max-returns = 10

[tool.ruff.lint.isort]
known-first-party = ["trade_agent", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "scripts", "lab/walk_forward.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["talib", "talib.*", "testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-m", "not live",
]
markers = [
    "live: testes contra Binance Testnet/Demo (exigem chaves no .env; rodar com `-m live`)",
    "integration: testes de integração (Binance simulada, Postgres em contêiner)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["trade_agent"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
