[project]
name = "trade-agent"
version = "0.1.0"
description = "Agente autônomo de trade de criptomoedas na Binance Spot com proteção nativa (OPOCO/OCO)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "cryptography>=45",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "respx>=0.22",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_agent"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "ASYNC", "S", "DTZ", "TID", "PL",
]
ignore = [
    "PLR0913",  # muitos argumentos: builders de ordem espelham a API da Binance
    "PLR2004",  # constantes mágicas em comparações
    "RUF001", "RUF002", "RUF003",  # caracteres ambíguos (textos em pt-BR)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415", "PLR0917", "SLF001"]
"scripts/**" = ["T201", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["trade_agent"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-m", "not live",
]
markers = [
    "live: testes contra Binance Testnet/Demo (exigem chaves no .env; rodar com `-m live`)",
    "integration: testes de integração (Binance simulada, Postgres em contêiner)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["trade_agent"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
