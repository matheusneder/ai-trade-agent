[project]
name = "trade-agent"
version = "0.1.0"
description = "Agente autônomo de trade de criptomoedas na Binance Spot com proteção nativa (OPOCO/OCO)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "alembic==1.20.1",
    "anthropic==2.3.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "numpy==2.5.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pandas==3.1.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.6",
    "structlog==26.1.0",
    "ta-lib==0.8.2",
    "websockets==17.3",
]

[project.scripts]
trade-agent = "trade_agent.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.170.9",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.10.0",
    "respx==0.23.1",
    "ruff==0.17.2",
    "testcontainers[postgres]==4.15.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_agent"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "ASYNC", "S", "DTZ", "TID", "PL",
]
ignore = [
    "PLR0913",  # too many arguments: order builders mirror the Binance API
    "PLR2004",  # magic constants in comparisons
    "RUF001", "RUF002", "RUF003",  # ambiguous characters (Portuguese texts)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415", "PLR0917", "SLF001", "PT018", "C408"]
"scripts/**" = ["T201", "S101"]
# constant SQL queries of the panels (no external input)
"scripts/grafana_dashboards.py" = ["T201", "E501", "S608"]
"src/trade_agent/persistence/migrations/**" = ["E501"]
"lab/freqtrade/**" = ["E501", "ARG002", "PLR0917"]

[tool.ruff.lint.pylint]
max-returns = 10

[tool.ruff.lint.isort]
known-first-party = ["trade_agent", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "scripts", "lab/walk_forward.py", "lab/paper.py"]
# the conftest.py of the E2E folders (dashed names are not packages: both would be module
# "conftest"); they only re-export the fixtures typed in tests/support
exclude = ['^tests/[^/]+-[^/]+/conftest\.py$']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["talib", "talib.*", "testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-m", "not live",
]
markers = [
    "live: testes contra Binance Testnet/Demo (exigem chaves no .env; rodar com `-m live`)",
    "integration: testes de integração (Binance simulada, Postgres em contêiner)",
    "e2e: end-to-end tests with Docker and a browser (Playwright); run by path, e.g. `uv run pytest tests/grafana-dashboard-smoke-tests`",
    "grafana: Grafana dashboard smoke tests (tests/grafana-dashboard-smoke-tests)",
    "signoz: SigNoz dashboard smoke tests (ephemeral SigNoz + Chromium); `uv run pytest tests/signoz-dashboard-smoke-tests`",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["trade_agent"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
