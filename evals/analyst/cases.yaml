# Analyst evaluation set (Phase 4). PARAPHRASED headlines; URLs in the reserved .example
# domain (they are not real sources). "synthetic" cases use fictional assets to reduce
# the effect of the model already knowing the outcome of historical events.
#
# expect: veto (must veto), no_veto (must not veto), regime (accepted), max/min_exposure,
#         negative (sentiment <= 0 or veto), positive (> 0 without veto), max_sentiment.

