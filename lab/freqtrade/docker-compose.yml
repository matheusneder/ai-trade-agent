# Laboratório de backtest/hyperopt (Freqtrade oficial). Uso via lab/walk_forward.py ou:
#   docker compose -f lab/freqtrade/docker-compose.yml run --rm freqtrade backtesting \
#       --config user_data/config.swing_trend.json --timerange 20250101-20250401
name: trade-agent-lab

services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    working_dir: /freqtrade
    volumes:
      - ./user_data:/freqtrade/user_data
      # mesmo pacote de sinais usado em produção; TA_LAB_SRC aponta para outra cópia
      # (ex.: um git worktree de outro commit) em comparações A/B
      - ${TA_LAB_SRC:-../../src}:/opt/trade_agent_src:ro
    environment:
      PYTHONPATH: /opt/trade_agent_src
