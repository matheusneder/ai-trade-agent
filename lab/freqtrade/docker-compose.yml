# Backtest/hyperopt lab (official Freqtrade). Use it through lab/walk_forward.py or:
#   docker compose -f lab/freqtrade/docker-compose.yml run --rm freqtrade backtesting \
#       --config user_data/config.swing_trend.json --timerange 20250101-20250401
name: trade-agent-lab

services:
  freqtrade:
    image: freqtradeorg/freqtrade@sha256:7031bca43ed7668ebf421725dd5016acade6ef88b0771db3e08c96e6d19a42db
    working_dir: /freqtrade
    volumes:
      - ./user_data:/freqtrade/user_data
      # the same signals package used in production; TA_LAB_SRC points to another copy
      # (e.g. a git worktree of another commit) for A/B comparisons
      - ${TA_LAB_SRC:-../../src}:/opt/trade_agent_src:ro
    environment:
      PYTHONPATH: /opt/trade_agent_src
