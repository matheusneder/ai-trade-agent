# Allocation profiles optimized for return maximization and drawdown control.
# Structure based on the trend regime (4h) and expansion of liquid momentum.
# Recalibrate with: uv run python -m lab.walk_forward --profile <profile> --detail 5m (D-034),
# also with --alts, the volatile alts the universe takes in during a pump (D-039)

account:
  quote_asset: USDT
  managed_capital: 1000        # Total cap of managed capital
  one_position_per_asset: true  # Prevents stacking risk on the same asset across profiles

profiles:
  swing_trend:
    # Recalibrated on 2026-10-01: median of the 15 trainings of the optimized walk-forward
    # (var/lab/walk-forward-swing_trend-otimizado-20261001-190610.md, 4h candles
    # since 2021-10). Risk, break-even and maximum holding are not optimized by the
    # lab and stay as they were. Risk 1.5% and activation 13% since 2026-10-25 (D-041,
    # doc/lab-results.md section 2.9).
    code: swg
    enabled: true
    capital_share: 0.65        # Main allocation: 650 USDT
    timeframe: 4h
    tiers: {core: 0.70, large: 0.30, mid: 0.0, small: 0.0}
    allocation:
      max_open_positions: 2    # Solid lots of ~275 USDT per trade (avoids fractional fees)
      max_position_pct: 0.42
      cash_reserve_pct: 0.15   # 15% liquidity for rebalancing
      risk_per_trade_pct: 1.5  # D-041 (was 1.2)
    entry:
      min_score: 0.67          # walk-forward (was 0.65)
      order: limit_fok
      max_slippage_bps: 18
    protection:
      stop: {mode: fixed, atr_mult: 3.1, max_pct: 4.5}   # walk-forward: atr_mult 3.1 (was 2.9)
      take_profit: {mode: trailing, activation_pct: 13.0, trailing_delta_bps: 100}   # D-041: activation 13 (was 9.7)
      break_even_after_r: 1.2  # Moves the stop to 0 after 1.2R of profit (removes reversal risk)
      max_holding: 18d
    exits:
      exit_score: -0.46        # walk-forward (was -0.53)
      exit_after_cycles: 1
    signals:
      adx_min: 24.0            # walk-forward (was 26)
      rsi_pullback_max: 41.0   # walk-forward: median equal to the previous one
      vol_rel_min: 2.3         # walk-forward (was 1.6)
      # D-039: no setup when the stop capped at 4.5% is narrower than 1.5 ATR (ATR above 3%):
      # the pumped alts the universe picks up stopped out inside their noise (doc/lab-results.md, 2.4)
      min_stop_atr: 1.5
    llm:
      weight: 0.25
      min_confidence: 0.65
      on_failure: ta_only_reduced

  momentum_alpha:
    # Calibrated on 2026-10-01: median of the 15 trainings of the optimized walk-forward
    # (var/lab/walk-forward-momentum_alpha-otimizado-20261001-181357.md, 4h candles
    # since 2021-10). Stop cap and TP activation revised on 2026-10-16 (D-034): chosen
    # on 2023-2024 and confirmed on 2025-2026 with 5m intra-candle exits, break-even
    # and maximum holding simulated (doc/lab-results.md).
    code: mom
    enabled: true
    capital_share: 0.30        # Tactical allocation: 300 USDT (was 0.35; 5% went to alt_atr)
    timeframe: 4h              # Moved from 1h to 4h to remove noise and fees
    tiers: {core: 0.30, large: 0.50, mid: 0.20, small: 0.0}
    allocation:
      max_open_positions: 2    # Lots of ~145 USDT
      max_position_pct: 0.42
      cash_reserve_pct: 0.15
      risk_per_trade_pct: 2.0  # D-041 (was 1.5)
    entry:
      min_score: 0.67          # walk-forward (was 0.62)
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 3.0, max_pct: 6.5}   # D-034: cap 6.5 (was 5.0); atr_mult from the walk-forward
      take_profit: {mode: trailing, activation_pct: 13.0, trailing_delta_bps: 130}   # D-034: activation 13 (was 9.5)
      break_even_after_r: 1.0  # Protects the capital right at 1.0R
      max_holding: 6d          # Quick exit if the thesis does not expand
    exits: 
      exit_score: -0.46        # walk-forward (was -0.45)
      exit_after_cycles: 1
    signals:
      adx_min: 29.0            # walk-forward (was 25)
      rsi_pullback_max: 35.0   # walk-forward: median equal to the previous one
      vol_rel_min: 2.6         # walk-forward (was 2.2)
      min_stop_atr: 2.0        # D-039: no setup with the 6.5% stop below 2 ATR (ATR above 3.25%)
    llm: 
      weight: 0.30
      min_confidence: 0.60
      on_failure: ta_only_reduced  # Does not block entries if the LLM API is unstable

  alt_atr:
    # Created on 2026-10-17 (D-036): fixed-parameter walk-forward with 5m intra-candle exits and
    # the Risk Guard's R:R check, 15 windows 2023-01 -> 2026-09 (doc/lab-results.md, 2.3):
    # +30.71%, +8.69% in 2025-2026. Small experimental share: the 2025-2026 holdout had
    # already been used, so the Demo is the validation. The ATR-based activation was tested
    # first (hence the name) and lost more in 2025-2026.
    code: alt
    enabled: true
    capital_share: 0.05        # Experimental allocation: 50 USDT
    timeframe: 4h
    tiers: {core: 0.0, large: 0.40, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 3    # Lots of ~17 USDT (above the 5 USDT minimum notional)
      max_position_pct: 0.34
      cash_reserve_pct: 0.10
      risk_per_trade_pct: 1.0
    entry:
      min_score: 0.67
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 3.0, max_pct: 7.0}
      # Fixed 10.9% on purpose: with the stop at its 7% cap the R:R is 1.49, below the Risk
      # Guard's 1.5, so the most volatile entries (ATR above ~2.3%) are refused. At 11% they
      # would pass (exactly 1.5) and 2025-2026 goes from +11% to -5% (doc/lab-results.md, 2.3)
      take_profit: {mode: trailing, activation_pct: 10.9, trailing_delta_bps: 150}
      break_even_after_r: 1.0
      max_holding: 10d
    exits:
      exit_score: -0.46
      exit_after_cycles: 1
    signals:
      adx_min: 26.0
      rsi_pullback_max: 38.0
      vol_rel_min: 1.8         # sweep 1.6-2.8: 1.6-2.0 best on both periods
    llm:
      weight: 0.25
      min_confidence: 0.65
      on_failure: ta_only_reduced

  # ------------------------------------------------------------ pair-local families (D-044)
  # Experimental, lab only: StrategyConfig refuses them enabled, since their risk budget
  # (`risk`) only exists in the lab and they would compete with the profiles above for the
  # same account. Entries and exits read only the pair's own candles, so they may buy with BTC
  # below its EMA 200. The signals are research seeds (trade_agent.signals.local), not a
  # calibration; the results are in doc/lab-results.md, section 2.10. capital_share gives the
  # lab a virtual capital of 100 USDT; no share of the account is taken.
  pair_pullback_1h:
    code: ppb1h
    enabled: false
    family: pair_pullback_rsi
    capital_share: 0.10
    timeframe: 1h
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.5
    entry:
      min_score: -1.0          # ranking only: the family's rules decide
      order: limit_fok
      max_slippage_bps: 20
    protection:
      # structural stop: at least 1.5 ATR away; beyond 6% the setup is discarded
      stop: {mode: fixed, atr_mult: 1.5, max_pct: 6.0}
      take_profit: {mode: limit, activation_pct: 0.5, activation_r: 1.5}   # target at 1.5R net
      max_holding: 48h
    llm: {enabled: false}
    risk: &local_risk
      cost_pct: 0.3            # round trip: 0.2% of fees and 0.1% of spread and slippage
      max_open_risk_pct: 1.0
      daily_loss_pct: 1.5      # marked to market
      consecutive_losses: 3
      cooldown: 24h
      max_drawdown_pct: 8      # no new entries until a review
      reentry_candles: 3       # after a stop on the pair

  pair_breakout_1h:
    code: pbo1h
    enabled: false
    family: pair_volatility_breakout
    capital_share: 0.10
    timeframe: 1h
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.5
    entry:
      min_score: -1.0
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 2.0, max_pct: 7.0}
      # trailing from 3R net, 1 ATR behind the top
      take_profit: {mode: trailing, activation_pct: 0.5, activation_r: 3.0, trailing_atr_mult: 1.0}
      max_holding: 72h
    llm: {enabled: false}
    risk: *local_risk

  pair_range_1h:
    code: prg1h
    enabled: false
    family: pair_range_reversion
    capital_share: 0.10
    timeframe: 1h
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.25  # less than the trend families
    entry:
      min_score: -1.0
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 1.5, max_pct: 4.0}
      # target at the middle band of the signal, frozen; the R:R check refuses it below 1.5
      take_profit: {mode: limit, activation_pct: 0.1, signal_target: true}
      max_holding: 12h
    llm: {enabled: false}
    risk: *local_risk
