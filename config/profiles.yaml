# Allocation profiles optimized for return maximization and drawdown control.
# Structure based on the trend regime (4h) and expansion of liquid momentum.
# Recalibrate with: uv run python -m lab.walk_forward --profile <profile> --detail 5m (D-034),
# also with --alts, the volatile alts the universe takes in during a pump (D-039)

account:
  quote_asset: USDT
  managed_capital: 1000        # Total cap of managed capital
  one_position_per_asset: true  # Prevents stacking risk on the same asset across profiles

profiles:
  swing_trend:
    # Recalibrated on 2026-10-01: median of the 15 trainings of the optimized walk-forward
    # (var/lab/walk-forward-swing_trend-otimizado-20261001-190610.md, 4h candles
    # since 2021-10). Risk, break-even and maximum holding are not optimized by the
    # lab and stay as they were. Activation 13% since 2026-10-25 (D-041; its 1.5% of risk
    # went to 0.75% on 2026-11-02, D-047, doc/lab-results.md section 2.12),
    # doc/lab-results.md section 2.9).
    code: swg
    enabled: true
    capital_share: 0.25        # Main allocation: 250 USDT (D-053, was 0.35: 0.10 went to lead_consensus_1h)
    timeframe: 4h
    tiers: {core: 0.70, large: 0.30, mid: 0.0, small: 0.0}
    allocation:
      max_open_positions: 2    # Lots of ~42 USDT at the 4.5% stop cap (~58 at 0.35; ~147 at 1.5%, D-047)
      max_position_pct: 0.42
      cash_reserve_pct: 0.15   # 15% liquidity for rebalancing
      risk_per_trade_pct: 0.75  # D-047 (was 1.5): the lab's own path stays under the 15% halt
    entry:
      min_score: 0.67          # walk-forward (was 0.65)
      order: limit_fok
      max_slippage_bps: 18
    protection:
      stop: {mode: fixed, atr_mult: 3.1, max_pct: 4.5}   # walk-forward: atr_mult 3.1 (was 2.9)
      take_profit: {mode: trailing, activation_pct: 13.0, trailing_delta_bps: 100}   # D-041: activation 13 (was 9.7)
      break_even_after_r: 1.2  # Moves the stop to 0 after 1.2R of profit (removes reversal risk)
      break_even_intrabar: true  # D-047: also checked on the bid every minute
      max_holding: 18d
    exits:
      exit_score: -0.46        # walk-forward (was -0.53)
      exit_after_cycles: 1
    signals:
      adx_min: 24.0            # walk-forward (was 26)
      rsi_pullback_max: 41.0   # walk-forward: median equal to the previous one
      vol_rel_min: 2.3         # walk-forward (was 1.6)
      # D-039: no setup when the stop capped at 4.5% is narrower than 1.5 ATR (ATR above 3%):
      # the pumped alts the universe picks up stopped out inside their noise (doc/lab-results.md, 2.4)
      min_stop_atr: 1.5
    llm:
      weight: 0.25
      min_confidence: 0.65
      on_failure: ta_only_reduced

  momentum_alpha:
    # Calibrated on 2026-10-01: median of the 15 trainings of the optimized walk-forward
    # (var/lab/walk-forward-momentum_alpha-otimizado-20261001-181357.md, 4h candles
    # since 2021-10). Stop cap and TP activation revised on 2026-10-16 (D-034): chosen
    # on 2023-2024 and confirmed on 2025-2026 with 5m intra-candle exits, break-even
    # and maximum holding simulated (doc/lab-results.md).
    code: mom
    enabled: true
    capital_share: 0.20        # Tactical allocation: 200 USDT (D-053, was 0.30: 0.10 went to lead_consensus_1h)
    timeframe: 4h              # Moved from 1h to 4h to remove noise and fees
    tiers: {core: 0.30, large: 0.50, mid: 0.20, small: 0.0}
    allocation:
      max_open_positions: 2    # Lots of ~23 USDT at the 6.5% stop cap (~35 at 0.30; ~69 at 1.5%, D-047)
      max_position_pct: 0.42
      cash_reserve_pct: 0.15
      risk_per_trade_pct: 0.75  # D-047 (was 1.5): the lab's own path stays under the 15% halt
    entry:
      min_score: 0.67          # walk-forward (was 0.62)
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 3.0, max_pct: 6.5}   # D-034: cap 6.5 (was 5.0); atr_mult from the walk-forward
      take_profit: {mode: trailing, activation_pct: 13.0, trailing_delta_bps: 130}   # D-034: activation 13 (was 9.5)
      break_even_after_r: 1.0  # Protects the capital right at 1.0R
      break_even_intrabar: true  # D-047: also checked on the bid every minute
      max_holding: 6d          # Quick exit if the thesis does not expand
    exits: 
      exit_score: -0.46        # walk-forward (was -0.45)
      exit_after_cycles: 1
    signals:
      adx_min: 29.0            # walk-forward (was 25)
      rsi_pullback_max: 35.0   # walk-forward: median equal to the previous one
      vol_rel_min: 2.6         # walk-forward (was 2.2)
      min_stop_atr: 2.0        # D-039: no setup with the 6.5% stop below 2 ATR (ATR above 3.25%)
    llm: 
      weight: 0.30
      min_confidence: 0.60
      on_failure: ta_only_reduced  # Does not block entries if the LLM API is unstable

  alt_atr:
    # Created on 2026-10-17 (D-036): fixed-parameter walk-forward with 5m intra-candle exits and
    # the Risk Guard's R:R check, 15 windows 2023-01 -> 2026-09 (doc/lab-results.md, 2.3):
    # +30.71%, +8.69% in 2025-2026. Small experimental share: the 2025-2026 holdout had
    # already been used, so the Demo is the validation. The ATR-based activation was tested
    # first (hence the name) and lost more in 2025-2026.
    code: alt
    enabled: true
    capital_share: 0.05        # Experimental allocation: 50 USDT
    timeframe: 4h
    tiers: {core: 0.0, large: 0.40, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 3    # Lots of ~17 USDT (above the 5 USDT minimum notional)
      max_position_pct: 0.34
      cash_reserve_pct: 0.10
      risk_per_trade_pct: 1.0
    entry:
      min_score: 0.67
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 3.0, max_pct: 7.0}
      # Fixed 10.9% on purpose: with the stop at its 7% cap the R:R is 1.49, below the Risk
      # Guard's 1.5, so the most volatile entries (ATR above ~2.3%) are refused. At 11% they
      # would pass (exactly 1.5) and 2025-2026 goes from +11% to -5% (doc/lab-results.md, 2.3)
      take_profit: {mode: trailing, activation_pct: 10.9, trailing_delta_bps: 150}
      break_even_after_r: 1.0
      break_even_intrabar: true  # D-047: also checked on the bid every minute
      max_holding: 10d
    exits:
      exit_score: -0.46
      exit_after_cycles: 1
    signals:
      adx_min: 26.0
      rsi_pullback_max: 38.0
      vol_rel_min: 1.8         # sweep 1.6-2.8: 1.6-2.0 best on both periods
    llm:
      weight: 0.25
      min_confidence: 0.65
      on_failure: ta_only_reduced

  # ------------------------------------------------------------ pair-local families (D-044)
  # Experimental: none was fit for the next phase (doc/lab-results.md, section 2.10); enabled
  # on the Demo on 2026-10-30 with 0.30 taken from swing_trend. Their risk budget (`risk`)
  # runs in the production Risk Guard as in the lab
  # (trade_agent.risk.scope). Entries and exits read only the pair's own candles, so they may
  # buy with BTC below its EMA 200. The signals are research seeds (trade_agent.signals.local),
  # not a calibration. The enabled shares add up to at most 1: pair_breakout_1h and
  # pair_range_1h, both rejected by the lab, gave half of theirs to lead_consensus_1h (D-052)
  # and were turned off when it went to 0.40 (D-053).
  pair_pullback_1h:
    code: ppb1h
    enabled: true
    family: pair_pullback_rsi
    capital_share: 0.10
    timeframe: 1h
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.5
    entry:
      min_score: -1.0          # ranking only: the family's rules decide
      order: limit_fok
      max_slippage_bps: 20
    protection:
      # structural stop: at least 1.5 ATR away; beyond 6% the setup is discarded
      stop: {mode: fixed, atr_mult: 1.5, max_pct: 6.0}
      take_profit: {mode: limit, activation_pct: 0.5, activation_r: 1.5}   # target at 1.5R net
      max_holding: 48h
    llm: {enabled: false}
    risk: &local_risk
      cost_pct: 0.3            # round trip: 0.2% of fees and 0.1% of spread and slippage
      max_open_risk_pct: 1.0
      daily_loss_pct: 1.5      # marked to market
      consecutive_losses: 3
      cooldown: 24h
      max_drawdown_pct: 8      # no new entries until a review
      reentry_candles: 3       # after a stop on the pair

  pair_breakout_1h:
    code: pbo1h
    enabled: false             # D-053: its 0.05 went to lead_consensus_1h
    family: pair_volatility_breakout
    capital_share: 0.05        # D-052 (was 0.10): 50 USDT; a stop above ~4.7% no longer fits the 5 USDT minimum
    timeframe: 1h
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.5
    entry:
      min_score: -1.0
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 2.0, max_pct: 7.0}
      # trailing from 3R net, 1 ATR behind the top
      take_profit: {mode: trailing, activation_pct: 0.5, activation_r: 3.0, trailing_atr_mult: 1.0}
      max_holding: 72h
    llm: {enabled: false}
    risk: *local_risk

  pair_range_1h:
    code: prg1h
    enabled: false             # D-053: its 0.05 went to lead_consensus_1h
    family: pair_range_reversion
    capital_share: 0.05        # D-052 (was 0.10): 50 USDT; it had no trade at 0.10 either (R:R check)
    timeframe: 1h
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.25  # less than the trend families
    entry:
      min_score: -1.0
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 1.5, max_pct: 4.0}
      # target at the middle band of the signal, frozen; the R:R check refuses it below 1.5
      take_profit: {mode: limit, activation_pct: 0.1, signal_target: true}
      max_holding: 12h
    llm: {enabled: false}
    risk: *local_risk

  # ------------------------------------------------------------ lead traders' consensus (D-052)
  # Experimental, with no lab verdict: the lead traders' trades have no history to replay, so
  # the Demo is the validation. Follows the best lead portfolios of Binance's Spot Copy Trading
  # ranking (trade_agent.leads) and buys an asset only when at least `min_backers` of them
  # bought it in the window AND the pair's own candles confirm it (trade_agent.signals.local).
  # Size, stop, target and exits are the profile's own: no trade is ever copied. The source is
  # Binance's website, public but undocumented: without fresh data no entry goes out. It
  # decides every `cycle` on the last closed candle, since the trades arrive between the
  # closes (D-053).
  lead_consensus_1h:
    code: lead1h
    enabled: true
    family: lead_consensus
    # 200 USDT (D-054): the 0.40 of D-053 (the 0.05 of pair_breakout_1h and of pair_range_1h,
    # and 0.10 each from swing_trend and momentum_alpha), half of it lent to
    # temp_cp_trade_validation
    capital_share: 0.20
    timeframe: 1h              # confirmation, stop and risk budget on the 1h candles
    cycle: 10m                 # decides at :00, :10 ... :50 on the last closed 1h candle (D-053)
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2    # with max_open_risk_pct 1.0, two positions at 0.5% of risk each
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.5
    entry:
      min_score: -1.0          # ranking only (share of the followed traders that bought)
      order: limit_fok
      max_slippage_bps: 20
    protection:
      # structural stop: at least 2 ATR away; beyond 6% the setup is discarded
      stop: {mode: fixed, atr_mult: 2.0, max_pct: 6.0}
      take_profit: {mode: limit, activation_pct: 0.5, activation_r: 2.0}   # target at 2R net
      max_holding: 72h
    signals:
      max_extension_atr: 1.5   # no entry with the close more than 1.5 ATR above the EMA 20
    llm: {enabled: false}
    risk: *local_risk
    leads:
      selection:               # who is followed (90-day ranking; trade_agent.leads.ranking)
        pool_pages: 5          # 150 portfolios, best Sharpe ratio first
        shortlist: 20          # candidates whose PnL curve and trades are read (2 requests each)
        max_leads: 6
        min_days: 90
        min_balance: 1000      # the trader's own money, USDT
        min_roi_pct: 3.0
        max_drawdown_pct: 20.0
        min_sharpe: 1.0
        max_copier_loss_pct: 5.0      # the copiers lost at most 5% of what they have in it
        min_positive_weeks_pct: 55.0  # 7 of the 12 weekly steps of the PnL curve
        min_recent_gain_pct: 0.0      # no loss over the last 30 days
        max_idle: 7d
        min_trades_30d: 4
        max_trades_per_day: 20.0      # above it: taken for a grid bot
      consensus:               # when their trades are a signal (trade_agent.leads.consensus)
        min_backers: 2         # buyers minus sellers: one trader alone never opens a position
        window: 24h
        min_buy_pct: 2.0       # net purchase, % of the trader's own balance
        max_symbols_per_lead: 3
        max_premium_pct: 1.5   # no entry with the ask more than 1.5% above what they paid
      poll_interval: 10m       # the followed traders' trades: one reading per cycle (D-053)
      ranking_interval: 6h     # who is followed
      max_data_age: 45m        # an older reading of a trader does not count
      max_ranking_age: 24h     # without a new ranking for this long: nobody is followed
      backoff: 1h              # after the source refuses a request
      request_delay_s: 0.5

  # ------------------------------------------------------------ copy trading flow test (D-054)
  # Temporary, Demo only, and no strategy: with the market down the traders lead_consensus_1h
  # follows barely trade, and it needs two of them on the same asset, so its flow (selection,
  # readings, consensus, the candles' confirmation, entry, protection and exits) has gone
  # untested. This one follows the traders that trade most often, whatever their results, buys
  # what a single one of them bought and decides at each 15m close. Turn it off and give its
  # share back to lead_consensus_1h once the flow is validated.
  temp_cp_trade_validation:
    code: tcpv15m
    enabled: true
    family: lead_consensus
    capital_share: 0.20        # 200 USDT, half of the 0.40 of lead_consensus_1h (D-054)
    timeframe: 15m             # confirmation, stop and risk budget on the 15m candles
    cycle: 15m                 # the timeframe itself: at each 15m close
    tiers: {core: 0.70, large: 0.70, mid: 0.70, small: 0.0}
    allocation:
      max_open_positions: 2
      max_position_pct: 0.35
      cash_reserve_pct: 0.30
      risk_per_trade_pct: 0.5
    entry:
      min_score: -1.0          # ranking only (share of the followed traders that bought)
      order: limit_fok
      max_slippage_bps: 20
    protection:
      stop: {mode: fixed, atr_mult: 2.0, max_pct: 6.0}
      take_profit: {mode: limit, activation_pct: 0.5, activation_r: 2.0}   # target at 2R net
      max_holding: 24h         # short, so the positions turn over and the exits run too
    signals:
      max_extension_atr: 1.5
    llm: {enabled: false}
    risk:
      <<: *local_risk
      cooldown: 4h             # 24h in the others: a pause does not hold the test for a day
    leads:
      selection:
        rank_by: activity      # the traders with the most trades per day, whatever their results
        pool_pages: 5
        shortlist: 20          # eligible ones sought in the ranking's order (an idle one costs 1 request)
        max_leads: 6
        min_days: 14
        min_balance: 100       # their purchases are measured against it (min_buy_pct)
        min_roi_pct: null      # null: not checked, this profile only tests the flow
        max_drawdown_pct: null
        min_sharpe: null
        max_copier_loss_pct: null
        min_positive_weeks_pct: null
        min_recent_gain_pct: null
        max_idle: 1d           # traded in the last day
        min_trades_30d: 30     # about one a day at least
        max_trades_per_day: 50.0      # above it: taken for a grid bot
      consensus:
        min_backers: 1         # one trader alone opens a position
        window: 6h
        min_buy_pct: 0.5       # net purchase, % of the trader's own balance
        max_symbols_per_lead: 3
        max_premium_pct: 1.5
      poll_interval: 15m       # one reading per cycle
      ranking_interval: 6h
      max_data_age: 45m
      max_ranking_age: 24h
      backoff: 1h
      request_delay_s: 0.5
