# Market analyst (doc 03, §7). The API key lives in the .env (ANTHROPIC_API_KEY).

models:
  analyst: claude-opus-5     # research cycle (adaptive thinking)
  triage: claude-sonnet-5    # pre-classification of headlines in volume
  effort: high
  max_tokens: 16000
  triage_max_tokens: 8000
  timeout_s: 300

pricing:                     # US$ per million tokens (platform.claude.com/docs/en/about-claude/pricing)
  models:
    claude-opus-5: {input: 5.00, output: 25.00}
    claude-sonnet-5: {input: 2.00, output: 10.00}
  cache_write_multiplier: 1.25
  cache_read_multiplier: 0.10
  web_search_per_1000: 10.00

budget:
  daily_usd: 5               # llm_daily_budget_usd circuit breaker (UTC day), checked once per cycle

web:                         # research step with web_search/web_fetch (Anthropic's server)
  enabled: true
  max_searches: 5
  max_fetches: 3
  max_continuations: 3

sources:
  rss_feeds:
    coindesk: https://www.coindesk.com/arc/outboundfeeds/rss/
    cointelegraph: https://cointelegraph.com/rss
    theblock: https://www.theblock.co/rss.xml
    decrypt: https://decrypt.co/feed
  binance_catalogs:          # public announcements on the Binance website
    48: listagens
    161: delistagens
    49: notícias da Binance
  fear_greed: true           # alternative.me
  derivatives: true          # funding and open interest (Binance Futures, public)
  derivatives_max_symbols: 12
  timeout_s: 15

digest:
  lookback_hours: 12
  max_items: 60
  summary_chars: 280
  min_relevance: 0.3

safety:
  bullish_threshold: 0.5     # sentiment above this requires sources
  min_bullish_sources: 2
  max_text_chars: 400
  max_list_items: 5
  max_view_age_hours: 8

asset_names:                 # names (lowercase) used to tag the assets mentioned
  BTC: [bitcoin]
  ETH: [ethereum, ether]
  SOL: [solana]
  BNB: [bnb chain, binance coin]
  XRP: [ripple, xrp ledger]
  DOGE: [dogecoin]
  ADA: [cardano]
  LINK: [chainlink]
  AVAX: [avalanche]
  TRX: [tron]
  LTC: [litecoin]
  DOT: [polkadot]
  ATOM: [cosmos hub]
  NEAR: [near protocol]
  UNI: [uniswap]
  FIL: [filecoin]
  APT: [aptos]
  OP: [optimism]
