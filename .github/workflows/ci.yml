name: Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the legacy regression test reads the base commit (D-044)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      # uv's version comes from [tool.uv] required-version (tests/unit/test_version_pins.py)
      - run: >-
          python -m pip install "uv$(python -c "import tomllib;
          print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['uv']['required-version'])")"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest tests/unit tests/integration -q --cov=trade_agent
